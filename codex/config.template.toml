# Codex portable preferences — seed template.
#
# install.sh allowlist-merges these preferences into ~/.codex/config.toml. The live
# file is never symlinked: machine-specific project trust, paths, and runtime state
# remain local and are preserved by scripts/apply-portable-config.py.
#
# Intentionally EXCLUDED (machine-specific, do not sync):
#   notify, [projects.*], [marketplaces.*], [mcp_servers.*], [plugins.*],
#   [desktop.*], [tui.model_availability_nux], [[skills.config]]
#
# notify on the main machine points at hooks/notify-wrapper.py (in this repo),
# which forwards to the computer-use client and logs per-subagent token usage
# to ~/.codex/log/subagent-usage.log — re-wire manually on a new machine.

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
web_search = "cached"
personality = "pragmatic"
approvals_reviewer = "auto_review"
service_tier = "default"
suppress_unstable_features_warning = true

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 1800

[features]
collaboration_modes = true
prevent_idle_sleep = true
goals = true
terminal_resize_reflow = true
js_repl = false

[notice]
fast_default_opt_out = true

[tui]
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "current-dir", "codex-version"]
status_line_use_colors = true
pet = "disabled"
