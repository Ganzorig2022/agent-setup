# Mirror-friendly tmux config (Mac <-> phone via SSH)

# Size the window to whichever client touched it last, so the phone
# attaching doesn't permanently shrink the Mac view
set -g window-size latest
setw -g aggressive-resize on

# True color + sane terminal for Claude Code / Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Mouse (scroll/tap works in Termux too)
set -g mouse on

# Big scrollback, instant escape (matters for TUI apps)
set -g history-limit 50000
set -s escape-time 0
